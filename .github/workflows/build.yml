name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Plugin bauen
        run: mvn --batch-mode clean package

      - name: JAR als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: DiscordBridge
          path: target/DiscordBridge.jar

      - name: Release erstellen (nur bei Tags wie v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" target/DiscordBridge.jar --generate-notes
